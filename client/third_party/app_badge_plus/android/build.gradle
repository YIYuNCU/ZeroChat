// ZeroChat 本地补丁（基于 app_badge_plus 1.3.5）：
// 上游脚本在自带的 buildscript 里加载 AGP 8.13.1，导致版本检测恒为 8，
// 在 AGP 9 + android.builtInKotlin=true 的工程里仍会应用 kotlin-android，
// 触发 Flutter 的 “plugins that apply Kotlin Gradle Plugin” 警告。
// 这里移除 buildscript 与 kotlin-android，Kotlin 由 AGP 9 内置提供。
// 上游发布修复版本后，可删除 client/third_party/app_badge_plus 与 pubspec.yaml 里的 dependency_overrides。
group = 'me.liolin.app_badge_plus'
version = '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

android {
    namespace = 'me.liolin.app_badge_plus'
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 19
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.20.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
